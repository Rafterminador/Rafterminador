<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <linearGradient id="spacebg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="100%" stop-color="#0d0d2b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      /* Stars */
      .s1{animation:tw1 2.1s ease-in-out infinite alternate;}
      .s2{animation:tw1 3.3s ease-in-out infinite alternate;}
      .s3{animation:tw1 1.7s ease-in-out infinite alternate;}
      .s4{animation:tw1 2.8s ease-in-out infinite alternate;}
      .s5{animation:tw1 1.4s ease-in-out infinite alternate;}
      @keyframes tw1{from{opacity:.1}to{opacity:1}}

      /* Typing (programmer hands move) */
      .hands{animation:type 0.25s ease-in-out infinite alternate;}
      @keyframes type{from{transform:translateY(0px)}to{transform:translateY(2px)}}

      /* Code lines on screen */
      .cl1{animation:codeline 5s 0s infinite;}
      .cl2{animation:codeline 5s 0.6s infinite;}
      .cl3{animation:codeline 5s 1.2s infinite;}
      .cl4{animation:codeline 5s 1.8s infinite;}
      .cl5{animation:codeline 5s 2.4s infinite;}
      @keyframes codeline{0%{opacity:0}5%{opacity:1}85%{opacity:1}100%{opacity:0}}

      /* Cursor blink */
      .cur{animation:blink 0.9s infinite;}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

      /* Rocket launch cycle: 0-2s idle, 2-6s launches, 6-7s reset */
      .rocket{animation:launch 7s 1s infinite;}
      @keyframes launch{
        0%{transform:translate(0px,0px);opacity:1}
        25%{transform:translate(0px,0px);opacity:1}
        28%{transform:translate(-4px,-8px) rotate(-5deg);opacity:1}
        55%{transform:translate(-90px,-180px) rotate(-35deg);opacity:1}
        75%{transform:translate(-160px,-290px) rotate(-50deg);opacity:0}
        99%{transform:translate(0px,0px);opacity:0}
        100%{transform:translate(0px,0px);opacity:1}
      }
      .flame{animation:flame 0.15s 3s infinite alternate;}
      @keyframes flame{from{opacity:.6}to{opacity:1}}

      /* Jarvis orb pulse */
      .jorb{animation:jpulse 1.8s ease-in-out infinite alternate;}
      @keyframes jpulse{from{r:20;opacity:.8}to{r:23;opacity:1}}
      .jring1{animation:jrot 4s linear infinite;transform-origin:638px 210px;}
      .jring2{animation:jrot2 3s linear infinite;transform-origin:638px 210px;}
      @keyframes jrot{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
      @keyframes jrot2{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
      .jdot{animation:jblink 1.2s infinite alternate;}
      @keyframes jblink{from{fill:#00ffff}to{fill:#0088ff}}

      /* Data stream dots (Jarvis → programmer) */
      .ds1{animation:stream 2s 0s linear infinite;}
      .ds2{animation:stream 2s 0.4s linear infinite;}
      .ds3{animation:stream 2s 0.8s linear infinite;}
      .ds4{animation:stream 2s 1.2s linear infinite;}
      .ds5{animation:stream 2s 1.6s linear infinite;}
      @keyframes stream{
        0%{transform:translateX(0px);opacity:0}
        10%{opacity:.8}
        90%{opacity:.8}
        100%{transform:translateX(-140px);opacity:0}
      }

      /* Moon glow pulse */
      .mglow{animation:moonpulse 3s ease-in-out infinite alternate;}
      @keyframes moonpulse{from{opacity:.15}to{opacity:.4}}

      /* Screen flicker */
      .scr{animation:sflicker 10s infinite;}
      @keyframes sflicker{0%,89%,91%,100%{opacity:1}90%{opacity:.7}}
    </style>
  </defs>

